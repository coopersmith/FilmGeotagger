[project]
name = "filmgeo"
version = "0.0.1"
description = "Give scanned film frames exact dates, offsets and GPS by aligning each roll against iPhone photos and other dated signals."
requires-python = ">=3.12"
dependencies = [
    "osxphotos>=0.76",
    "pillow>=11",
    "typer>=0.15",
    "rich>=13",
]

[project.optional-dependencies]
# Added at M1: anthropic, torch, open_clip_torch, timm, numpy
# Added at M3: fastapi, uvicorn, pydantic
dev = ["pytest>=8"]
embed = [
    "numpy>=2.5.2",
    "open-clip-torch>=3.3.0",
    "timm>=1.0.29",
    "torch>=2.14.0",
]
verify = [
    "anthropic>=1.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
filmgeo = "filmgeo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmgeo"]
